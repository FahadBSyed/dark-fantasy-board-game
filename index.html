<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Fantasy — Combat Prototype</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="banner">
        <h1>The Hollow Gauntlet</h1>
        <p id="subtitle">pass 3 — stamina &amp; attacks</p>
      </header>

      <main id="stage">
        <aside id="log-panel">
          <div id="log" aria-label="battle log"></div>
        </aside>

        <div class="board-col">
          <div id="enemy-stats" aria-label="enemy stat card"></div>
          <div id="enemy-deck" aria-label="enemy attack deck"></div>
          <div id="token-pile" aria-label="token pile"></div>
          <div id="board" aria-label="combat grid"></div>
          <section id="weapon" aria-label="weapon card"></section>
        </div>

        <aside id="stamina-area">
          <div class="stamina-title">Stamina</div>
          <div id="stamina-pile" class="stamina-pool" aria-label="stamina pile"></div>
          <div id="stamina-prompt"></div>
          <div class="stamina-zone-label">spend zone</div>
          <div id="stamina-zone" class="stamina-pool zone" aria-label="spend zone"></div>
        </aside>
      </main>
    </div>

    <div id="dice-tray" aria-hidden="true"></div>
    <div id="countdown" aria-live="assertive"></div>
    <div id="turn-flash" aria-live="polite"></div>

    <div id="control-dock" role="toolbar" aria-label="combat controls">
      <button id="turn-left" type="button" title="Turn left (Q)" aria-label="Turn left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
      <button id="end-turn" type="button" title="End turn (Enter)" aria-label="End turn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
      </button>
      <button id="turn-right" type="button" title="Turn right (E)" aria-label="Turn right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
