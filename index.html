<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Fantasy — Combat Prototype</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="banner">
        <h1>The Hollow Gauntlet</h1>
        <p id="subtitle">pass 3 — stamina &amp; attacks</p>
      </header>

      <main id="stage">
        <div id="board" aria-label="combat grid"></div>

        <aside id="hud">
          <div id="vitals"></div>
          <p id="hint">
            Click the token to select it, then click a highlighted square to
            move (up to 5 squares per turn). Use the buttons (or Q / E) to
            rotate. Select an attack from your weapon card to stage it (its
            target squares highlight), then End turn to strike.
          </p>
          <div id="log" aria-label="log"></div>
        </aside>
      </main>

      <section id="weapon" aria-label="weapon card"></section>
    </div>

    <div id="control-dock" role="toolbar" aria-label="combat controls">
      <div id="stamina" class="stamina-pip" title="Stamina remaining" aria-label="Stamina">5</div>
      <span class="dock-divider" aria-hidden="true"></span>
      <button id="turn-left" type="button" title="Turn left (Q)" aria-label="Turn left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
      <button id="end-turn" type="button" title="End turn (Enter)" aria-label="End turn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
      </button>
      <button id="turn-right" type="button" title="Turn right (E)" aria-label="Turn right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
